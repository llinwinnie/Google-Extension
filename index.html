<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dailydo</title>
    <link rel="stylesheet" href="node_modules/bulma/css/bulma.css">
    <script src="services/jquery.js"></script>
    <script src="services/bg.js"></script>
    <script src="services/header.js"></script>
    <script src="services/weather.js"></script>
    <script src="services/quotes.js"></script>
    <script src="services/button.js"></script>
    <script src="services/todo.js"></script> 
    <style>
        .mainbg {
            height: 100vh;
            background-repeat: no-repeat;
            background-size: cover;
        }
        .trans{
            height: 100vh;
            background-color: #0d242485;
        }
        
    </style>
</head>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .mainbg {
      height: 100vh;
      background-image: url('https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1350&q=80');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
    }

    .trans {
      height: 100vh;
      background-color: rgba(13, 36, 36, 0.52);
    }

    /* Top‐links container */
    .google-links {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .google-links img {
      width: 24px;
      height: 24px;
    }

    /* Larger spacing for sections on mobile */
    .section {
      padding-top: 1.5rem;
      padding-bottom: 1.5rem;
    }

    /* Quotes/news text style */
    #quotes p,
    #news p {
      font-size: 0.9rem;
      color: #edf2f7;
    }

    /* To‐do list styling */
    #todoSection li {
      margin-bottom: 0.5rem;
    }
  </style>
</head>

<body> 
    <div class="mainbg">
        <div class="trans">
            <section class="section">
                <div class="container">
                    <div class="columns">
                        <div class="columns is-vcentered is-mobile">
                        <div class=" columns is-4 google-apps">
                            <a href="https://mail.google.com/" target="_blank" class="has-text-white">
                                <img src="https://www.gstatic.com/images/branding/product/1x/gmail_2020q4_48dp.png" alt="Gmail">
                                <span>Gmail</span>
                            </a>

                            <div class="apps-menu">
                                <img src="https://www.gstatic.com/images/icons/material/system/2x/apps_black_24dp.png" alt="Google Apps">
                            </div>
                        </div>

                        <div class="column is-2" id="weather">
                            <p class = "has-text-color-black has-text-weight-bold">weather</p>
                        </div>
                    </div>
                </div>

                <section class="section">
                    <div class="container">
                    <div class="columns is-vcentered is-mobile">
                        <div class="column is-narrow">
                            <button id="newsButton" class="button is-small is-dark">News</button>
                        </div>
                        <div class="column is-narrow">
                         <button id="quoteButton" class="button is-small is-dark">Quotes</button>
                        </div>
                        <div class="column is-4" id="quotes">
                            <p>—</p>
                        </div>
                        <div class="column is-4" id="news">
                            <p>—</p>
                        </div>
                    </div>
                    </div>
                </section>
          
            <section class="section">
                <div class="container">
                    <div class="columns is-centered">
                        <div class="column is-half" id="header">
                            <input id="nameInput" class="input is-large is-focused is-primary is-rounded" type="text"
                             placeholder="Enter your name" />
                            <button id="nameSaveBtn" class="button is-small is-primary mt-2">Save</button>
                        </div>
                        <p id="greeting" class="mt-3 has-text-white"></p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="container">
                    <div class="columns is-centered">
                        <div class="column is-half">
                            <div class="control">
                               <input id="todoInput" class="input is-rounded" placeholder="What’s your plan today?" />
                            </div>
                        </div>
                    </div>
                    <div class="columns is-centered">
                        <div class="column is-half ml-6">
                            <ul id="todoSection"></ul>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
</body>

</html>
